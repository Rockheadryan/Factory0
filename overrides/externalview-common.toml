#Camera settings
[camera]
	#Camera Speed, from 0.01 to 10, default = 0.5
	# Default: 0.5
	# Range: 0.01 ~ 10.0
	cameraSpeed = 0.5
	#View Distance, from 1 to 128, default = 56
	# Default: 56.0
	# Range: 1.0 ~ 128.0
	viewDistance = 56.0
	#Enable camera collision (prevent clipping through blocks), default = true
	cameraCollision = true

#Reach settings
[reach]
	#Reach Distance, from 1 to 64, default = 40
	# Default: 40.0
	# Range: 1.0 ~ 64.0
	reach = 40.0
	#Default Reach Distance, from 1 to 64, default = 5 (vanilla is 5.0, changing may cause issues)
	# Default: 5.0
	# Range: 1.0 ~ 64.0
	defaultReach = 5.0
	#Command to set block interaction range, use {value} as placeholder, do not change
	blockReachCommand = "attribute @s minecraft:player.block_interaction_range base set {value}"
	#Command to set entity interaction range, use {value} as placeholder, do not change
	entityReachCommand = "attribute @s minecraft:player.entity_interaction_range base set {value}"
