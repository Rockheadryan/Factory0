#Enable Fading Depths. Changes apply without restarting.
enabled = true

[depth]
	#Blocks below the LOCAL water surface before sunlight begins fading.
	# Default: 15.0
	# Range: 0.0 ~ 4096.0
	startDepth = 15.0
	#Depth where sunlight reaches minimumBrightness. Must exceed startDepth.
	# Default: 80.0
	# Range: 1.0 ~ 4096.0
	darkDepth = 80.0
	#Fade curve. 1 = balanced; higher values keep middle depths brighter.
	# Default: 1.0
	# Range: 0.1 ~ 8.0
	curve = 1.0
	#Remaining sunlight at darkDepth. 0 = none; 1 = no reduction.
	#Block light and emissive materials are preserved.
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	minimumBrightness = 0.0
	#Smoothing time in seconds. 0 = immediate.
	# Default: 0.65
	# Range: 0.0 ~ 10.0
	transitionSeconds = 0.65
	#How much Night Vision improves visibility: 0 = none, 1 = full.
	#The shader patch preserves ambient visibility without restoring direct sunlight.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	nightVisionRelief = 1.0
	#Give Conduit Power the same relief as Night Vision.
	conduitRelief = true
	#Maximum blocks to search upward. No chunks are generated or force-loaded.
	#Water continuing above this limit is treated as deep water.
	# Default: 1024
	# Range: 16 ~ 4096
	surfaceScanLimit = 1024
	#Treat water directly sealed by an opaque, unlit ceiling as deep.
	#Open cave pools still use their own water surface.
	darkenCoveredWater = true
	#Look around small overhangs through connected loaded water.
	#Surface changes use the normal transition time.
	stableSurfaceSampling = true
	#Maximum horizontal water-path length for a covered-column detour.
	#Searches share a hard budget of 4096 sampled positions and never load chunks.
	# Default: 3
	# Range: 0 ~ 4
	surfaceSearchRadius = 3
	#Dimension IDs where depth effects are disabled.
	#Dimensions without skylight are also left alone.
	excludedDimensions = ["minecraft:the_nether", "minecraft:the_end"]

[sunlightColor]
	#Filter warm colors out of natural underwater light.
	#Optional and disabled by default. Lamps and emission retain their colors.
	sunlightColorAbsorption = false
	#Color-filter strength. Zero is neutral; 1 is the standard effect.
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	colorAbsorptionStrength = 1.0

[fog]
	#Fade underwater fog toward darkness along with the sunlight.
	darkenFog = true
	#Remaining fog brightness at darkDepth.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	minimumFogBrightness = 0.01
	#Fog density multiplier at darkDepth. 1 preserves normal visibility.
	#Higher values shorten visibility independently of darkness.
	# Default: 1.0
	# Range: 1.0 ~ 8.0
	deepFogDensity = 1.0

[shaderCompatibility]
	#Blend distant underwater geometry into matching fog.
	#Requires a Complementary pack generated by /fadingdepths patch.
	#This conceals the render-distance seam; it does not extend terrain.
	underwaterHorizonBlend = true
	#Start blending at this fraction of the normal render distance.
	# Default: 0.55
	# Range: 0.05 ~ 0.95
	horizonBlendStart = 0.55
	#Finish blending before this fraction of the render distance.
	#Values at or below horizonBlendStart are safely corrected at runtime.
	# Default: 0.85
	# Range: 0.1 ~ 1.0
	horizonBlendEnd = 0.85
